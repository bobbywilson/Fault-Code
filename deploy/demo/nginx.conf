server {
    listen 8080 default_server;
    server_name _;
    location = /healthz { access_log off; return 200 'alive'; }
    location / { return 444; }
}
server {
    listen 8080;
    server_name faultcodeai.com www.faultcodeai.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://faultcodeai.com$request_uri; }
}
server {
    listen 8443 ssl;
    server_name faultcodeai.com www.faultcodeai.com;
    # Keep redirects on the browser-facing origin, not Docker's internal 8443.
    absolute_redirect off;
    ssl_certificate /etc/faultcode/tls/fullchain.pem;
    ssl_certificate_key /etc/faultcode/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    if ($host = www.faultcodeai.com) { return 308 https://faultcodeai.com$request_uri; }
    if ($host != faultcodeai.com) { return 444; }
    location = /docs { return 308 /docs/; }
    location /docs/ { proxy_pass http://documentation:8080; proxy_set_header Host $host; }
    location = /mailpit { return 308 /mailpit/; }
    location = /_mailpit_access {
        internal;
        proxy_pass http://administration:8080/session/mailpit-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host faultcodeai.com;
    }
    location @mailpit_signin { return 302 /admin/dashboard; }
    location /mailpit/ {
        auth_request /_mailpit_access;
        error_page 401 = @mailpit_signin;
        proxy_pass http://mailpit:8025;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location / {
        proxy_pass http://administration:8080;
        proxy_set_header Host faultcodeai.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
}
