name: faultcode-mail
services:
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
      MP_SMTP_RELAY_ALL: "false"
    volumes: [mailpit-data:/data]
    networks: [capture]
    cpus: 0.25
    mem_limit: 256m
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
networks:
  capture:
    driver: bridge
volumes:
  mailpit-data:
