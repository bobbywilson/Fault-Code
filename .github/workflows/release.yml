name: Linux release candidate
on:
  push:
    branches: [main, development]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: [self-hosted, Linux, X64, faultcode-ci]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Build private Linux archives and verify disposable rollback
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/release-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          path: |
            artifacts/release/*.json
            artifacts/release/*.jsonl
            artifacts/release/SHA256SUMS
          if-no-files-found: error
