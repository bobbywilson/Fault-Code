name: Backend foundation
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [development]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, faultcode-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict
        env:
          OPENSPEC_TELEMETRY: '0'
      - run: dotnet restore FaultCode.slnx --locked-mode
      - run: dotnet build FaultCode.slnx --configuration Release --no-restore
      - run: dotnet test FaultCode.slnx --configuration Release --no-build --logger trx --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-contracts.txt
      - run: python scripts/check-api-contract.py artifacts/openapi/faultcode-v1.json contracts/openapi-v1.json
      - run: python scripts/check-mcp-contract.py artifacts/mcp-contracts.json
      - run: python -m unittest discover -s tests/deployment -p 'test_*.py'
      - run: python scripts/release-evidence.py artifacts/test-results artifacts/release-evaluations.json
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-release-evaluations
          path: artifacts/release-evaluations.json
          if-no-files-found: error
      - name: Compare against base branch contract
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          if git cat-file -e "$BASE_SHA:contracts/openapi-v1.json" 2>/dev/null; then
            git show "$BASE_SHA:contracts/openapi-v1.json" > artifacts/base-openapi-v1.json
            python scripts/check-api-transition.py artifacts/openapi/faultcode-v1.json artifacts/base-openapi-v1.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-ubuntu-latest
          path: |
            artifacts/openapi/faultcode-v1.json
            artifacts/mcp-contracts.json
      - run: dotnet format FaultCode.slnx --verify-no-changes --no-restore
