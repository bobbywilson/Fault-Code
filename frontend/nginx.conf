server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Cache-Control "no-store" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; }
 location /session { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location /workspace/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location /health/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location /swagger/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location /openapi/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
 location = /browser-config.json { try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
}
