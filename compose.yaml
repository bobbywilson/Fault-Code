name: faultcode
services:
  api:
    image: faultcode-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      FaultCode__ApplicationName: Fault Code
      Qdrant__Enabled: "true"
      Qdrant__Endpoint: http://qdrant:6333
      Qdrant__ApiKey: ${FAULTCODE_QDRANT_API_KEY:?Set FAULTCODE_QDRANT_API_KEY in .env or the shell}
    ports:
      - "127.0.0.1:${FAULTCODE_API_PORT:-5081}:8080"
    depends_on:
      qdrant:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  qdrant:
    image: faultcode-qdrant:local
    build:
      context: .
      dockerfile: docker/Qdrant.Dockerfile
    environment:
      QDRANT__SERVICE__API_KEY: ${FAULTCODE_QDRANT_API_KEY:?Set FAULTCODE_QDRANT_API_KEY in .env or the shell}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-storage:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    networks: [backend]
    security_opt: [no-new-privileges:true]
  proxy:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    ports:
      - "127.0.0.1:${FAULTCODE_PROXY_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health/live]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  backend:
    internal: true
volumes:
  qdrant-storage:
  qdrant-snapshots:
