# Explicit local SQL Server overlay. Not added to the shared demo deployment.
# docker compose -f compose.yaml -f compose.sqlserver.yaml up -d
services:
  api:
    environment:
      ConnectionStrings__FaultCode: ${FAULTCODE_SQL_CONNECTION:?Set the least-privilege application connection string}
    depends_on:
      sqlserver:
        condition: service_healthy
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-RTM-ubuntu-22.04@sha256:54b23ca766287dab5f6f55162923325f07cdec6ccb42108f37c55c87e7688ebd
    platform: linux/amd64
    environment:
      ACCEPT_EULA: ${FAULTCODE_SQL_ACCEPT_EULA:?Review Microsoft terms and set Y}
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${FAULTCODE_SQL_SA_PASSWORD:?Set a strong local bootstrap password outside Git}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks: [backend]
    cpus: 1.0
    mem_limit: 3g
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
volumes:
  sqlserver-data:
